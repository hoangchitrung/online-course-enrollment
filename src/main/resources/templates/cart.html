<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - FlexLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">
        <h1 class="my-4">Giỏ hàng của bạn</h1>
        <div th:if="${#lists.isEmpty(cartItems)}">
            <p>Giỏ hàng của bạn đang trống.</p>
        </div>
        <div th:if="!${#lists.isEmpty(cartItems)}">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Khóa học</th>
                        <th>Lớp học (Cohort)</th>
                        <th>Giá</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td th:text="${item.courseCart.name}">Tên khóa học</td>
                        <td>
                            <span th:if="${item.courseCohort != null}"
                                th:text="${item.courseCohort.cohortName}">Tên lớp học</span>
                            <span th:if="${item.courseCohort == null}" class="text-muted">N/A</span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT')} + ' VNĐ'">1,234,567 VNĐ</td>
                        <td>
                            <a href="#" class="btn btn-danger btn-sm">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-end">
                <a href="#" class="btn btn-primary">Tiến hành thanh toán</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
