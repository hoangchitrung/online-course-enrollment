<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${course.name} + ' - FlexLearn'">Chi tiết khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">📚 FlexLearn</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card mb-4">
                    <img th:src="${course.image != null ? course.image : 'https://via.placeholder.com/900x300?text=No+Image'}"
                        class="card-img-top" th:alt="${course.name}" />
                    <div class="card-body">
                        <h2 class="card-title" th:text="${course.name}"></h2>
                        <p class="text-muted mb-2">Tác giả: <span th:text="${course.author}"></span></p>
                        <p class="mb-2">Loại: <strong th:text="${course.courseType}"></strong></p>
                        <p class="mb-2">Giá: <strong th:text="${course.price} + ' VNĐ'"></strong></p>
                        <p class="mb-3" th:text="${course.description}"></p>
                        <div class="d-flex gap-2">
                            <a href="/" class="btn btn-secondary">Quay về</a>
                            <form th:action="@{'/cart/add/' + ${course.id}}" method="post"
                                sec:authorize="isAuthenticated()">
                                <button type="submit" class="btn btn-success">Đăng ký (Enroll)</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Modules and Lessons -->
                <div class="card mb-4">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">Danh sách Modules</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(modules)}">
                            <p class="text-muted">Chưa có module nào cho khóa học này.</p>
                        </div>
                        <div th:each="module : ${modules}">
                            <div class="mb-3">
                                <h5 class="mb-1">Module <span th:text="${module.moduleNumber}"></span>: <span
                                        th:text="${module.title}"></span></h5>
                                <p class="mb-1 text-muted" th:text="${module.description}"></p>
                                <div th:if="${#lists.isEmpty(module.lessons)}">
                                    <span class="text-muted small">Chưa có bài học nào.</span>
                                </div>
                                <ul class="list-group list-group-flush" th:if="${!#lists.isEmpty(module.lessons)}">
                                    <li class="list-group-item px-0 py-1" th:each="lesson : ${module.lessons}">
                                        <strong>Bài <span th:text="${lesson.lessonNumber}"></span>:</strong>
                                        <span th:text="${lesson.title}"></span>
                                        <span class="text-muted small" th:if="${lesson.durationMinutes != null}">
                                            (Thời lượng: <span th:text="${lesson.durationMinutes}"></span> phút)
                                        </span>
                                        <span class="badge bg-secondary ms-2" th:if="${lesson.isPreview}">Preview</span>
                                    </li>
                                </ul>
                            </div>
                            <hr />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
