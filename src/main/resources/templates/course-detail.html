<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${course.name} + ' - FlexLearn'">Chi tiết khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-p6LL+7uN2d5ZdBqS8h4lkjw2Py1QnBiA+2aBzQkx1mszUuOxltEbxMt/jkFikDLP4xDn2KNUMzW0M9cTY7TRDw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Ensure consistent box model */
        }

        html,
        body {
            height: 100%;
        }

        .navbar {
            margin: 0;
            padding: 0;
        }

        .navbar-dark .navbar-nav .nav-link,
        .navbar-brand,
        .navbar-dark .navbar-nav .nav-link:focus,
        .navbar-dark .navbar-nav .nav-link:hover {
            color: #fff !important;
        }

        .navbar .dropdown-menu {
            background: #0c4dab;
        }

        .navbar .dropdown-item,
        .navbar .dropdown-item:hover,
        .navbar .dropdown-item:focus {
            color: #fff;
        }

        body {
            padding-top: 70px;
            /* Ensure content is not hidden under the sticky navbar */
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark"
        style="background: linear-gradient(90deg, #1a73e8 0%, #00b0ff 100%);">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-atom fa-lg"></i>
                <span>FlexLearn</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link position-relative" href="/cart">
                            <i class="fa-solid fa-cart-shopping me-1"></i> Giỏ hàng
                            <span
                                class="badge bg-danger position-absolute top-0 start-100 translate-middle p-1 rounded-circle">0</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link btn btn-outline-light btn-sm ms-2" href="/signin">Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card mb-4">
                    <div class="position-relative text-center" style="min-height:300px;">
                        <img th:src="${course.image != null ? course.image : null}" class="card-img-top"
                            th:alt="${course.name}"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                        <div class="placeholder-image d-flex flex-column justify-content-center align-items-center position-absolute top-50 start-50 translate-middle"
                            th:if="${course.image == null}">
                            <i class="fa-solid fa-image fa-3x text-muted"></i>
                            <div class="mt-2 text-muted">Ảnh không khả dụng</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <h2 class="card-title" th:text="${course.name}"></h2>
                        <p class="text-muted mb-2">Tác giả: <span th:text="${course.author}"></span></p>
                        <p class="mb-2">Loại: <strong th:text="${course.courseType}"></strong></p>
                        <p class="mb-2">Giá: <strong th:text="${course.price} + ' VNĐ'"></strong></p>
                        <p class="mb-3" th:text="${course.description}"></p>
                        <div class="d-flex gap-2">
                            <a href="/" class="btn btn-secondary">Quay về</a>
                            <form th:action="@{'/cart/add/' + ${course.id}}" method="post"
                                sec:authorize="isAuthenticated()">
                                <button type="submit" class="btn btn-success">Đăng ký (Enroll)</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Modules and Lessons -->
                <div class="card mb-4">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">Danh sách Modules</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(modules)}">
                            <p class="text-muted">Chưa có module nào cho khóa học này.</p>
                        </div>
                        <div th:each="module : ${modules}">
                            <div class="mb-3">
                                <h5 class="mb-1">Module <span th:text="${module.moduleNumber}"></span>: <span
                                        th:text="${module.title}"></span></h5>
                                <p class="mb-1 text-muted" th:text="${module.description}"></p>
                                <div th:if="${#lists.isEmpty(module.lessons)}">
                                    <span class="text-muted small">Chưa có bài học nào.</span>
                                </div>
                                <ul class="list-group list-group-flush" th:if="${!#lists.isEmpty(module.lessons)}">
                                    <li class="list-group-item px-0 py-1" th:each="lesson : ${module.lessons}">
                                        <strong>Bài <span th:text="${lesson.lessonNumber}"></span>:</strong>
                                        <span th:text="${lesson.title}"></span>
                                        <span class="text-muted small" th:if="${lesson.durationMinutes != null}">
                                            (Thời lượng: <span th:text="${lesson.durationMinutes}"></span> phút)
                                        </span>
                                        <span class="badge bg-secondary ms-2" th:if="${lesson.isPreview}">Preview</span>
                                    </li>
                                </ul>
                            </div>
                            <hr />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
