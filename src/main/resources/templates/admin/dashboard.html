<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Admin Dashboard - Course Management</h1>
            <form method="post" action="/logout" th:action="@{/logout}">
                <button type="submit" class="btn btn-outline-danger">Logout</button>
            </form>
        </div>
        <a class="btn btn-success mb-3" href="/admin/courses/new">Create New Course</a>

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Type</th>
                    <th>Price</th>
                    <th>Modules</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}"></td>
                    <td th:text="${course.name}"></td>
                    <td th:text="${course.author}"></td>
                    <td th:text="${course.courseType}"></td>
                    <td th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                    <td th:text="${course.modulesCount}"></td>
                    <td>
                        <a th:href="@{'/admin/courses/' + ${course.id} + '/edit'}"
                            class="btn btn-primary btn-sm">Edit</a>
                        <form th:action="@{'/admin/courses/' + ${course.id} + '/delete'}" method="post"
                            class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Delete course?');">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
