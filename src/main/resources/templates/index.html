<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexLearn - Learning Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-p6LL+7uN2d5ZdBqS8h4lkjw2Py1QnBiA+2aBzQkx1mszUuOxltEbxMt/jkFikDLP4xDn2KNUMzW0M9cTY7TRDw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Hero Section -->
    <section class="hero text-center py-5">
        <div class="container">
            <h1 class="display-5 fw-bold mb-3">Online Learning</h1>
            <p class="lead mb-4">Discover hundreds of high-quality courses</p>
            <a href="#courses" class="btn btn-light btn-lg">Explore</a>
        </div>
    </section>

    <!-- Courses -->
    <section class="py-5 bg-light" id="courses">
        <div class="container">
            <h2 class="mb-2">Featured Courses</h2>
            <p class="text-muted mb-4">Choose from hundreds of courses</p>
            <div th:if="${#lists.isEmpty(courses)}" class="alert alert-warning">No courses available at the moment.
            </div>
            <div class="row g-4" th:if="${!#lists.isEmpty(courses)}">
                <div class="col-lg-4 col-md-6" th:each="course : ${courses}">
                    <div class="card h-100 shadow-sm">
                        <div class="position-relative text-center" style="min-height:200px;">
                            <img th:src="${course.image != null ? course.image : null}" class="card-img-top"
                                th:alt="${course.name}"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                            <div class="placeholder-image d-flex flex-column justify-content-center align-items-center position-absolute top-50 start-50 translate-middle"
                                th:if="${course.image == null}">
                                <i class="fa-solid fa-image fa-3x text-muted"></i>
                                <div class="mt-2 text-muted">Image not available</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${course.name}"></h5>
                            <p class="card-text text-muted small">👤 <span th:text="${course.author}"></span></p>
                            <p class="card-text small" th:text="${course.description}"></p>
                            <div class="d-flex justify-content-between align-items-center">
                                <strong class="text-primary"
                                    th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></strong>
                                <span class="badge bg-info" th:text="${course.courseType}"></span>
                            </div>
                        </div>
                        <div class="card-footer bg-white">
                            <a th:href="@{'/course/' + ${course.id}}" class="btn btn-primary btn-sm w-100">View
                                Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 FlexLearn. All rights reserved.</p>
            <div class="mt-2">
                <a href="#" class="me-3">Facebook</a>
                <a href="#" class="me-3">Twitter</a>
                <a href="#">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
