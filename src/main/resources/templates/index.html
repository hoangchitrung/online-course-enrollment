<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexLearn - Nền tảng học tập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📚 FlexLearn</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#courses">Khóa học</a></li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link btn btn-light btn-sm ms-2" href="/signin">Đăng nhập</a>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span>👤</span>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/user/dashboard">User profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form action="/logout" method="post" class="px-3 py-1">
                                    <button type="submit" class="btn btn-outline-danger btn-sm w-100">Đăng xuất</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="bg-primary text-white text-center py-5">
        <div class="container">
            <h1 class="display-5 fw-bold mb-3">Học tập trực tuyến</h1>
            <p class="lead mb-4">Khám phá hàng trăm khóa học chất lượng</p>
            <a href="#courses" class="btn btn-light btn-lg">Khám phá</a>
        </div>
    </section>

    <!-- Courses -->
    <section class="py-5 bg-light" id="courses">
        <div class="container">
            <h2 class="mb-2">Các khóa học nổi bật</h2>
            <p class="text-muted mb-4">Chọn từ hàng trăm khóa học</p>

            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Thêm khóa học mới</h5>
                    <form id="create-course-form" class="row g-2">
                        <div class="col-md-6">
                            <input id="course-name" type="text" class="form-control" placeholder="Tên khóa học"
                                required>
                        </div>
                        <div class="col-md-6">
                            <input id="course-author" type="text" class="form-control" placeholder="Tác giả" required>
                        </div>
                        <div class="col-md-6">
                            <input id="course-type" type="text" class="form-control"
                                placeholder="Loại (SELF_PACED / LIVE_BOOT_CAMP)" required>
                        </div>
                        <div class="col-md-6">
                            <input id="course-price" type="number" step="0.01" class="form-control" placeholder="Giá"
                                required>
                        </div>
                        <div class="col-12">
                            <input id="course-image" type="text" class="form-control" placeholder="URL ảnh">
                        </div>
                        <div class="col-12">
                            <textarea id="course-description" class="form-control" rows="2"
                                placeholder="Mô tả"></textarea>
                        </div>
                        <div class="col-md-6">
                            <input id="course-modules" type="number" class="form-control" placeholder="Số modules">
                        </div>
                        <div class="col-md-6 d-grid">
                            <button type="submit" class="btn btn-success">Thêm khóa học</button>
                        </div>
                        <div class="col-12">
                            <div id="create-course-message" class="text-success d-none"></div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="loading" class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-muted mt-2">Đang tải...</p>
            </div>

            <div id="error" class="alert alert-danger d-none"></div>

            <div id="courses-container" class="row g-4 d-none"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 FlexLearn. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        async function loadCourses() {
            try {
                const res = await fetch('/api/courses');
                if (!res.ok) throw new Error('Failed to fetch');

                const courses = await res.json();
                document.getElementById('loading').classList.add('d-none');

                if (!courses.length) {
                    document.getElementById('error').innerHTML = 'Không có khóa học';
                    document.getElementById('error').classList.remove('d-none');
                    return;
                }

                const html = courses.map(c => `
                    <div class="col-lg-4 col-md-6">
                        <div class="card h-100 shadow-sm">
                            <img src="${c.image || 'https://via.placeholder.com/300x200?text=Course'}" 
                                 class="card-img-top" alt="${c.name}">
                            <div class="card-body">
                                <h5 class="card-title">${escape(c.name)}</h5>
                                <p class="card-text text-muted small">👤 ${escape(c.author)}</p>
                                <p class="card-text small">${escape(c.description || '')}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <strong class="text-primary">${formatPrice(c.price)}</strong>
                                    <span class="badge bg-info">${c.courseType}</span>
                                </div>
                            </div>
                            <div class="card-footer bg-white">
                                <button class="btn btn-primary btn-sm w-100" onclick="goToCourseDetail(${c.id})">Xem chi tiết</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                document.getElementById('courses-container').innerHTML = html;
                document.getElementById('courses-container').classList.remove('d-none');
            } catch (err) {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('error').innerHTML = 'Lỗi tải khóa học: ' + err.message;
                document.getElementById('error').classList.remove('d-none');
            }
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(price);
        }

        function escape(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function goToCourseDetail(courseId) {
            window.location.href = `/course/${courseId}`;
        }

        async function createCourse(e) {
            e.preventDefault();

            const data = {
                name: document.getElementById('course-name').value.trim(),
                author: document.getElementById('course-author').value.trim(),
                courseType: document.getElementById('course-type').value.trim(),
                price: parseFloat(document.getElementById('course-price').value),
                image: document.getElementById('course-image').value.trim() || null,
                description: document.getElementById('course-description').value.trim() || null,
                modulesCount: Number(document.getElementById('course-modules').value || 0)
            };

            const msg = document.getElementById('create-course-message');
            msg.classList.add('d-none');
            msg.classList.remove('text-danger', 'text-success');

            try {
                const res = await fetch('/api/courses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const err = await res.text();
                    msg.textContent = 'Lỗi thêm khóa học: ' + err;
                    msg.classList.remove('d-none');
                    msg.classList.add('text-danger');
                    return;
                }

                msg.textContent = 'Thêm khóa học thành công.';
                msg.classList.remove('d-none');
                msg.classList.add('text-success');
                document.getElementById('create-course-form').reset();
                loadCourses();
            } catch (err) {
                msg.textContent = 'Lỗi thêm khóa học: ' + err.message;
                msg.classList.remove('d-none');
                msg.classList.add('text-danger');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCourses();
            document.getElementById('create-course-form').addEventListener('submit', createCourse);
        });
    </script>
</body>

</html>
