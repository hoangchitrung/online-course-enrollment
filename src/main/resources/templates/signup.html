<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-sm border-0" style="max-width: 440px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold text-center mb-2">Tạo Tài Khoản 📝</h1>
                <p class="text-body-secondary text-center mb-4">Đăng ký để bắt đầu học tập</p>

                <form id="signup-form" method="post">
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Họ và tên</label>
                        <input id="fullName" name="fullName" type="text" class="form-control" placeholder="Nguyễn Văn A"
                            required />
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" name="email" type="email" class="form-control" placeholder="you@example.com"
                            required />
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input id="password" name="password" type="password" class="form-control"
                            placeholder="Tối thiểu 8 ký tự" minlength="8" required />
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Tạo Tài Khoản</button>
                    <div id="error-message" class="alert alert-danger mt-3 d-none" role="alert"></div>
                </form>

                <hr class="my-4" />

                <p class="text-body-secondary text-center small mb-0">
                    Đã có tài khoản? <a href="/signin" class="link-primary text-decoration-none">Đăng nhập ngay</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('d-none');

            const data = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    window.location.href = '/signin?registered=true';
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.message || 'Đăng ký thất bại, vui lòng thử lại';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                errorDiv.textContent = 'Có lỗi xảy ra: ' + error.message;
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
